# CI = このリポ唯一の必須チェック（job id `ci`）。main の protect-main ruleset が要求する — 名前を変えない。
# 方針: この yaml は「安定シェル」— steps はリポ内のファイル（package.json の scripts / .claude/hooks /
# .node-version）を呼ぶだけにする。サンドボックスの token は workflow yaml を push できないが、
# これらのファイルは push できるので、CI の中身の変更はコンテナから完結する。
# action の @vN 更新は Dependabot（.github/dependabot.yml）が PR を出す。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Status hub size check (docs/status.md ≤ 40 lines / 3 KB, fixed headings)
        run: bash .claude/hooks/check-status.sh docs/status.md
      - uses: pnpm/action-setup@v6 # no `version:` — it reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm run ci
